name: Export Sequoia Port Sources

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: macos-15-intel

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Fetch PR 1055
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/OpenIntelWireless/itlwm.git
          git fetch --no-tags upstream \
            +refs/pull/1055/head:refs/remotes/upstream/pr1055
          git checkout --detach refs/remotes/upstream/pr1055

      - name: Collect Sequoia port sources
        run: |
          mkdir -p export/AirportItlwm
          mkdir -p export/include/Airport
          mkdir -p export/Project

          cp itlwm.xcodeproj/project.pbxproj \
             export/Project/

          cp -R itlwm.xcodeproj/xcshareddata \
             export/Project/ 2>/dev/null || true

          cp AirportItlwm/*.cpp \
             export/AirportItlwm/ || true

          cp AirportItlwm/*.hpp \
             export/AirportItlwm/ || true

          cp AirportItlwm/*.plist \
             export/AirportItlwm/ || true

          cp include/Airport/IO80211*.h \
             export/include/Airport/ || true

          cp include/Airport/Apple80211* \
             export/include/Airport/ 2>/dev/null || true

          find export -type f | sort > export/file-list.txt

      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Sequoia-source-snapshot
          path: export
