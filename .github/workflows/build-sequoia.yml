name: Final Link Validate AirportItlwm Sequoia

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone MacKernelSDK
        run: |
          git clone --depth=1 https://github.com/acidanthera/MacKernelSDK.git

      - name: Patch postMessage for Sequoia
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("include/Airport/IO80211ControllerV2.h")
          s = p.read_text()

          old1 = "virtual void postMessage(UInt,void *,unsigned long,UInt,void *);"
          old2 = "virtual void postMessage(UInt, void *, unsigned long, UInt, void *);"

          new = (
              "virtual void postMessage("
              "IO80211SkywalkInterface *, UInt, void *, unsigned long, bool);"
          )

          if old1 in s:
              s = s.replace(old1, new)
          elif old2 in s:
              s = s.replace(old2, new)
          else:
              raise SystemExit("Old postMessage signature not found")

          p.write_text(s)
          PY

      - name: Build
        run: |
          set -o pipefail

          xcodebuild \
            -project itlwm.xcodeproj \
            -target "AirportItlwm-Sonoma14.4" \
            -configuration Debug \
            SYMROOT="$PWD/build" \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee xcodebuild.log

      - name: Locate kext
        run: |
          KEXT=$(find build -type d -name "AirportItlwm.kext" | head -1)
          BIN="$KEXT/Contents/MacOS/AirportItlwm"

          echo "KEXT=$KEXT" >> "$GITHUB_ENV"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

          test -d "$KEXT"
          test -f "$BIN"

      - name: Prepare permissions
        run: |
          sudo chown -R root:wheel "$KEXT"
          sudo find "$KEXT" -type d -exec chmod 755 {} \;
          sudo find "$KEXT" -type f -exec chmod 644 {} \;
          sudo chmod 755 "$BIN"

      - name: Show unresolved kernel symbols
        continue-on-error: true
        run: |
          mkdir -p diagnostics

          echo "===== UNRESOLVED SYMBOLS =====" \
            | tee diagnostics/unresolved.txt

          sudo kmutil libraries \
            -z \
            -p "$KEXT" \
            --undef-symbols \
            2>&1 | tee -a diagnostics/unresolved.txt

      - name: Show all symbol resolutions
        continue-on-error: true
        run: |
          sudo kmutil libraries \
            -z \
            -p "$KEXT" \
            --all-symbols \
            2>&1 | tee diagnostics/all-symbols.txt

      - name: Deep diagnostics without authentication
        continue-on-error: true
        run: |
          sudo kmutil print-diagnostics \
            -z \
            -p "$KEXT" \
            -D \
            -a x86_64 \
            2>&1 | tee diagnostics/deep-link-test.txt

      - name: Extract important results
        if: always()
        run: |
          {
            echo "===== FAILURES ====="

            grep -RniE \
              "not found|Failed to bind|undefined|multiply-defined|dependency.*fail|cannot link|linking failed|error:" \
              diagnostics \
              || true

            echo
            echo "===== postMessage ====="

            nm -u "$BIN" | grep -i postMessage || true

          } | tee diagnostics/summary.txt

      - name: Package
        if: always()
        run: |
          mkdir -p artifact

          cp -R "$KEXT" artifact/
          cp -R diagnostics artifact/
          cp xcodebuild.log artifact/

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            artifact \
            AirportItlwm-Sequoia-final-validation.zip

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Sequoia-final-validation
          path: AirportItlwm-Sequoia-final-validation.zip
