name: Inspect AirportItlwm Sequoia Project

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-15-intel

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Fetch PR 1055
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/OpenIntelWireless/itlwm.git
          git fetch --no-tags upstream \
            +refs/pull/1055/head:refs/remotes/upstream/pr1055
          git checkout --detach refs/remotes/upstream/pr1055

      - name: Show targets and schemes
        run: |
          xcodebuild \
            -project itlwm.xcodeproj \
            -list \
            -json \
            | tee project-list.json

      - name: Find Sequoia references in project
        run: |
          echo "===== SEQUOIA FILE REFERENCES =====" \
            > sequoia-project.txt

          grep -n -B 15 -A 25 \
            "AirportItlwm_Sequoia" \
            itlwm.xcodeproj/project.pbxproj \
            >> sequoia-project.txt || true

          echo "" >> sequoia-project.txt
          echo "===== BUILD PHASE REFERENCES =====" \
            >> sequoia-project.txt

          grep -n -B 30 -A 50 \
            "Sources" \
            itlwm.xcodeproj/project.pbxproj \
            >> sequoia-project.txt || true

      - name: List relevant target names
        run: |
          grep -n \
            "name = AirportItlwm" \
            itlwm.xcodeproj/project.pbxproj \
            | tee airport-targets.txt || true

      - name: Show Sequoia source headers
        run: |
          sed -n '1,240p' \
            AirportItlwm/AirportItlwm_Sequoia.hpp \
            > AirportItlwm_Sequoia_hpp.txt

          sed -n '1,320p' \
            AirportItlwm/AirportItlwm_Sequoia.cpp \
            > AirportItlwm_Sequoia_cpp.txt

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Sequoia-project-inspection
          path: |
            project-list.json
            sequoia-project.txt
            airport-targets.txt
            AirportItlwm_Sequoia_hpp.txt
            AirportItlwm_Sequoia_cpp.txt
