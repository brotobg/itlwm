name: Build AirportItlwm Sequoia

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Fetch Sequoia Tahoe PR 1055
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/OpenIntelWireless/itlwm.git

          git fetch --no-tags upstream \
            +refs/pull/1055/head:refs/remotes/upstream/pr1055

          git checkout --detach refs/remotes/upstream/pr1055

          echo "===== COMMIT ====="
          git log -1 --oneline

      - name: Clone MacKernelSDK
        run: |
          rm -rf MacKernelSDK
          git clone --depth=1 \
            https://github.com/acidanthera/MacKernelSDK.git

      - name: Show environment
        run: |
          echo "===== macOS ====="
          sw_vers

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== SDK ====="
          xcrun --show-sdk-version

          echo "===== ARCH ====="
          uname -m

      - name: Inspect Xcode project
        run: |
          echo "===== PROJECT LIST ====="

          xcodebuild \
            -project itlwm.xcodeproj \
            -list \
            | tee project-list.txt

          echo ""
          echo "===== SEQUOIA PROJECT REFERENCES ====="

          grep -Rni \
            "Sequoia\|Tahoe\|AirportItlwm_Sequoia" \
            AirportItlwm \
            itlwm.xcodeproj \
            2>/dev/null \
            | tee sequoia-project-references.txt \
            || true

      - name: Show AirportItlwm build settings
        run: |
          xcodebuild \
            -project itlwm.xcodeproj \
            -scheme "AirportItlwm" \
            -configuration Debug \
            -showBuildSettings \
            | tee airport-build-settings.txt

      - name: Build AirportItlwm only
        run: |
          set -o pipefail

          xcodebuild \
            -project itlwm.xcodeproj \
            -scheme "AirportItlwm" \
            -configuration Debug \
            -derivedDataPath build \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee xcodebuild.log

      - name: Extract diagnostics
        if: always()
        run: |
          grep -n -E \
            "error:|warning:|undefined symbol|BUILD FAILED|AirportItlwm_Sequoia|target '" \
            xcodebuild.log \
            > compiler-errors.txt || true

          echo "===== IMPORTANT DIAGNOSTICS ====="
          cat compiler-errors.txt || true

      - name: Find generated kexts
        if: always()
        run: |
          find build \
            -type d \
            -name "*.kext" \
            -print \
            | tee generated-kexts.txt \
            || true

      - name: Validate binaries
        if: success()
        run: |
          mkdir -p analysis

          find build \
            -path "*/AirportItlwm*.kext/Contents/MacOS/*" \
            -type f \
            -print \
            > analysis/binaries.txt

          while IFS= read -r BIN; do

            echo "======================================"
            echo "$BIN"
            echo "======================================"

            file "$BIN"

            echo "--- postMessage ---"
            nm -u "$BIN" | grep -i postMessage || true

            echo "--- IO80211 ---"
            nm -u "$BIN" | grep -i IO80211 | head -100 || true

          done < analysis/binaries.txt \
            | tee analysis/binary-analysis.txt

      - name: Package successful build
        if: success()
        run: |
          mkdir -p artifacts

          find build \
            -type d \
            -name "AirportItlwm*.kext" \
            -exec cp -R {} artifacts/ \;

          cp xcodebuild.log artifacts/
          cp compiler-errors.txt artifacts/
          cp project-list.txt artifacts/
          cp airport-build-settings.txt artifacts/
          cp sequoia-project-references.txt artifacts/
          cp generated-kexts.txt artifacts/
          cp -R analysis artifacts/

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            artifacts \
            AirportItlwm-Sequoia-native.zip

      - name: Upload successful build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Sequoia-native
          path: AirportItlwm-Sequoia-native.zip

      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Sequoia-build-logs
          path: |
            xcodebuild.log
            compiler-errors.txt
            project-list.txt
            airport-build-settings.txt
            sequoia-project-references.txt
            generated-kexts.txt
