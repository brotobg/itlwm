name: Build AirportItlwm Sequoia ABI Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Clone MacKernelSDK
        run: |
          rm -rf MacKernelSDK
          git clone --depth=1 https://github.com/acidanthera/MacKernelSDK.git

      - name: Patch IO80211Controller postMessage ABI for Sequoia
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("include/Airport/IO80211ControllerV2.h")
          s = p.read_text()

          old = "virtual void postMessage(UInt,void *,unsigned long,UInt,void *);"
          new = "virtual void postMessage(IO80211SkywalkInterface *,UInt,void *,unsigned long,bool);"

          if old not in s:
              raise SystemExit("Old postMessage signature not found")

          s = s.replace(old, new)

          p.write_text(s)

          print("Patched:")
          print(new)
          PY

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version
          uname -m

      - name: Build Sonoma14.4 target against Sequoia
        run: |
          set -o pipefail

          xcodebuild \
            -project itlwm.xcodeproj \
            -target "AirportItlwm-Sonoma14.4" \
            -configuration Debug \
            SYMROOT="$PWD/build" \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee xcodebuild.log

      - name: Extract diagnostics
        if: always()
        run: |
          grep -n -E \
            "error:|warning:|undefined symbol|BUILD FAILED|postMessage" \
            xcodebuild.log \
            > compiler-errors.txt || true

          cat compiler-errors.txt || true

      - name: Find generated kext
        if: always()
        run: |
          find build \
            -type d \
            -name "AirportItlwm.kext" \
            -print \
            | tee generated-kexts.txt || true

      - name: Validate postMessage ABI
        if: success()
        run: |
          mkdir -p analysis

          BIN=$(find build \
            -path "*/AirportItlwm.kext/Contents/MacOS/AirportItlwm" \
            -type f \
            | head -1)

          echo "Binary: $BIN"

          file "$BIN" | tee analysis/file.txt

          echo "===== Undefined postMessage symbols =====" \
            | tee analysis/postmessage.txt

          nm -u "$BIN" \
            | grep -i postMessage \
            | tee -a analysis/postmessage.txt \
            || true

          echo "===== All IO80211Controller symbols =====" \
            | tee analysis/io80211controller.txt

          nm -u "$BIN" \
            | grep -i IO80211Controller \
            | tee -a analysis/io80211controller.txt \
            || true

      - name: Package successful build
        if: success()
        run: |
          mkdir -p artifacts

          KEXT=$(find build \
            -type d \
            -name "AirportItlwm.kext" \
            | head -1)

          cp -R "$KEXT" artifacts/

          cp xcodebuild.log artifacts/
          cp compiler-errors.txt artifacts/
          cp generated-kexts.txt artifacts/
          cp -R analysis artifacts/

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            artifacts \
            AirportItlwm-Sequoia-ABI-test.zip

      - name: Upload successful build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Sequoia-ABI-test
          path: AirportItlwm-Sequoia-ABI-test.zip

      - name: Upload failed diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Sequoia-build-logs
          path: |
            xcodebuild.log
            compiler-errors.txt
            generated-kexts.txt
