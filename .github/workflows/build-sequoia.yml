name: Validate AirportItlwm on Sequoia

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-15-intel

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Clone MacKernelSDK
        run: |
          rm -rf MacKernelSDK
          git clone --depth=1 https://github.com/acidanthera/MacKernelSDK.git

      - name: Patch IO80211Controller postMessage ABI for Sequoia
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("include/Airport/IO80211ControllerV2.h")
          s = p.read_text()

          old_variants = [
              "virtual void postMessage(UInt,void *,unsigned long,UInt,void *);",
              "virtual void postMessage(UInt, void *, unsigned long, UInt, void *);",
          ]

          new = "virtual void postMessage(IO80211SkywalkInterface *, UInt, void *, unsigned long, bool);"

          found = False
          for old in old_variants:
              if old in s:
                  s = s.replace(old, new)
                  found = True
                  break

          if not found:
              raise SystemExit("Old postMessage signature not found")

          p.write_text(s)

          print("Patched IO80211ControllerV2.h")
          print(new)
          PY

      - name: Show environment
        run: |
          echo "===== macOS ====="
          sw_vers

          echo "===== Xcode ====="
          xcodebuild -version

          echo "===== SDK ====="
          xcrun --show-sdk-version
          xcrun --show-sdk-path

          echo "===== Architecture ====="
          uname -m

      - name: Build AirportItlwm Sonoma14.4 ABI test
        run: |
          set -o pipefail

          xcodebuild \
            -project itlwm.xcodeproj \
            -target "AirportItlwm-Sonoma14.4" \
            -configuration Debug \
            SYMROOT="$PWD/build" \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee xcodebuild.log

      - name: Locate built kext
        id: locate
        run: |
          KEXT=$(find build -type d -name "AirportItlwm.kext" | head -1)

          if [ -z "$KEXT" ]; then
            echo "AirportItlwm.kext not found"
            exit 1
          fi

          echo "KEXT=$KEXT" >> "$GITHUB_ENV"

          BIN="$KEXT/Contents/MacOS/AirportItlwm"

          if [ ! -f "$BIN" ]; then
            echo "AirportItlwm binary not found"
            exit 1
          fi

          echo "BIN=$BIN" >> "$GITHUB_ENV"

          echo "Found kext:"
          echo "$KEXT"

          echo "Found binary:"
          echo "$BIN"

      - name: Inspect binary
        run: |
          mkdir -p diagnostics

          echo "===== FILE =====" \
            | tee diagnostics/file.txt

          file "$BIN" \
            | tee -a diagnostics/file.txt

          echo "===== ARCHITECTURES =====" \
            | tee diagnostics/architectures.txt

          lipo -info "$BIN" \
            | tee -a diagnostics/architectures.txt

          echo "===== INFO.PLIST =====" \
            | tee diagnostics/plist.txt

          plutil -p "$KEXT/Contents/Info.plist" \
            | tee -a diagnostics/plist.txt

      - name: Inspect undefined symbols
        run: |
          echo "===== ALL UNDEFINED SYMBOLS =====" \
            | tee diagnostics/undefined-symbols.txt

          nm -u "$BIN" \
            | tee -a diagnostics/undefined-symbols.txt

          echo "===== postMessage SYMBOLS =====" \
            | tee diagnostics/postmessage-symbols.txt

          nm -u "$BIN" \
            | grep -i postMessage \
            | tee -a diagnostics/postmessage-symbols.txt \
            || true

          echo "===== IO80211Controller SYMBOLS =====" \
            | tee diagnostics/io80211controller-symbols.txt

          nm -u "$BIN" \
            | grep -i IO80211Controller \
            | tee -a diagnostics/io80211controller-symbols.txt \
            || true

          echo "===== IO80211SkywalkInterface SYMBOLS =====" \
            | tee diagnostics/skywalk-symbols.txt

          nm -u "$BIN" \
            | grep -i IO80211SkywalkInterface \
            | tee -a diagnostics/skywalk-symbols.txt \
            || true

          echo "===== IO80211InfraInterface SYMBOLS =====" \
            | tee diagnostics/infra-symbols.txt

          nm -u "$BIN" \
            | grep -i IO80211InfraInterface \
            | tee -a diagnostics/infra-symbols.txt \
            || true

      - name: Validate bundle structure
        run: |
          echo "===== CODESIGN =====" \
            | tee diagnostics/codesign.txt

          codesign -dvvv "$KEXT" \
            2>&1 \
            | tee -a diagnostics/codesign.txt \
            || true

          echo "===== KEXT INFO =====" \
            | tee diagnostics/kext-info.txt

          kmutil inspect \
            -b "$KEXT" \
            2>&1 \
            | tee -a diagnostics/kext-info.txt \
            || true

      - name: Prepare ownership and permissions
        run: |
          sudo chown -R root:wheel "$KEXT"

          sudo find "$KEXT" \
            -type d \
            -exec chmod 755 {} \;

          sudo find "$KEXT" \
            -type f \
            -exec chmod 644 {} \;

          sudo chmod 755 "$BIN"

      - name: Run kextutil validation
        continue-on-error: true
        run: |
          echo "===== KEXTUTIL VALIDATION =====" \
            | tee diagnostics/kextutil.txt

          sudo kextutil \
            -v 6 \
            "$KEXT" \
            2>&1 \
            | tee -a diagnostics/kextutil.txt

      - name: Run kmutil load diagnostic
        continue-on-error: true
        run: |
          echo "===== KMUTIL LOAD =====" \
            | tee diagnostics/kmutil-load.txt

          sudo kmutil load \
            -p "$KEXT" \
            2>&1 \
            | tee -a diagnostics/kmutil-load.txt

      - name: Check kmutil result for linker failures
        run: |
          echo "===== LINKER FAILURE SEARCH =====" \
            | tee diagnostics/linker-check.txt

          grep -Ei \
            "Failed to bind|could not find a kext which exports this symbol|undefined symbol|linking|KMErrorDomain|Code=31|Code=30" \
            diagnostics/kmutil-load.txt \
            diagnostics/kextutil.txt \
            | tee -a diagnostics/linker-check.txt \
            || true

      - name: Save build logs
        if: always()
        run: |
          cp xcodebuild.log diagnostics/ || true

          find build \
            -type d \
            -name "*.kext" \
            -print \
            > diagnostics/generated-kexts.txt \
            || true

      - name: Package validation result
        if: always()
        run: |
          mkdir -p artifact

          cp -R "$KEXT" artifact/ || true
          cp -R diagnostics artifact/

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            artifact \
            AirportItlwm-Sequoia-validation.zip

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Sequoia-validation
          path: AirportItlwm-Sequoia-validation.zip
