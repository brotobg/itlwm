name: Build AirportItlwm Sequoia

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Fetch native Sequoia PR 1055
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/OpenIntelWireless/itlwm.git

          git fetch --no-tags upstream \
            +refs/pull/1055/head:refs/remotes/upstream/pr1055

          git checkout --detach refs/remotes/upstream/pr1055

          echo "===== CURRENT COMMIT ====="
          git log -1 --oneline

          echo "===== CURRENT BRANCH STATE ====="
          git status --short

      - name: Clone MacKernelSDK
        run: |
          rm -rf MacKernelSDK
          git clone --depth=1 https://github.com/acidanthera/MacKernelSDK.git

      - name: Show build environment
        run: |
          echo "===== macOS ====="
          sw_vers

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== SDK ====="
          xcrun --show-sdk-version
          xcrun --show-sdk-path

          echo "===== ARCH ====="
          uname -m

      - name: Inspect Sequoia project
        run: |
          echo "===== XCODE PROJECT ====="
          xcodebuild -project itlwm.xcodeproj -list

          echo "===== SEQUOIA REFERENCES ====="
          grep -Rni "Sequoia" \
            AirportItlwm \
            itlwm.xcodeproj/project.pbxproj \
            2>/dev/null | head -150 || true

      - name: Detect Sequoia target
        id: detect
        run: |
          xcodebuild \
            -project itlwm.xcodeproj \
            -list \
            -json > /tmp/xcode-list.json

          python3 <<'PY'
          import json
          import os

          with open("/tmp/xcode-list.json") as f:
              data = json.load(f)

          project = data.get("project", {})
          targets = project.get("targets", [])
          schemes = project.get("schemes", [])

          print("Targets:")
          for x in targets:
              print("  ", x)

          print("Schemes:")
          for x in schemes:
              print("  ", x)

          sequoia_targets = [
              x for x in targets
              if "sequoia" in x.lower()
          ]

          sequoia_schemes = [
              x for x in schemes
              if "sequoia" in x.lower()
          ]

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              if sequoia_schemes:
                  out.write(f"mode=scheme\n")
                  out.write(f"name={sequoia_schemes[0]}\n")
              elif sequoia_targets:
                  out.write(f"mode=target\n")
                  out.write(f"name={sequoia_targets[0]}\n")
              elif "AirportItlwm (all)" in schemes:
                  out.write("mode=scheme\n")
                  out.write("name=AirportItlwm (all)\n")
              elif "AirportItlwm" in schemes:
                  out.write("mode=scheme\n")
                  out.write("name=AirportItlwm\n")
              else:
                  raise SystemExit(
                      "No suitable AirportItlwm build target/scheme found"
                  )
          PY

      - name: Build native AirportItlwm
        run: |
          set -o pipefail

          MODE="${{ steps.detect.outputs.mode }}"
          NAME="${{ steps.detect.outputs.name }}"

          echo "Building using $MODE: $NAME"

          if [ "$MODE" = "target" ]; then
            xcodebuild \
              -project itlwm.xcodeproj \
              -target "$NAME" \
              -configuration Debug \
              -derivedDataPath build \
              ARCHS=x86_64 \
              ONLY_ACTIVE_ARCH=YES \
              MACOSX_DEPLOYMENT_TARGET=15.0 \
              2>&1 | tee xcodebuild.log
          else
            xcodebuild \
              -project itlwm.xcodeproj \
              -scheme "$NAME" \
              -configuration Debug \
              -derivedDataPath build \
              ARCHS=x86_64 \
              ONLY_ACTIVE_ARCH=YES \
              MACOSX_DEPLOYMENT_TARGET=15.0 \
              2>&1 | tee xcodebuild.log
          fi

      - name: Extract diagnostics
        if: always()
        run: |
          grep -n -E \
            "error:|warning:|undefined symbol|unimplemented pure virtual method|BUILD FAILED" \
            xcodebuild.log \
            > compiler-errors.txt || true

          echo "===== IMPORTANT DIAGNOSTICS ====="
          tail -300 compiler-errors.txt || true

      - name: Find AirportItlwm kexts
        if: always()
        run: |
          echo "===== GENERATED KEXTS ====="
          find build -type d -name "AirportItlwm*.kext" -print || true

      - name: Validate native binaries
        if: success()
        run: |
          mkdir -p analysis

          find build \
            -path "*/AirportItlwm*.kext/Contents/MacOS/*" \
            -type f \
            -print > analysis/binaries.txt

          while IFS= read -r BIN; do
            echo "===================================="
            echo "$BIN"
            echo "===================================="

            file "$BIN"

            echo "--- Undefined postMessage symbols ---"
            nm -u "$BIN" | grep -i postMessage || true

            echo "--- IO80211 symbols ---"
            nm -u "$BIN" | grep -i IO80211 | head -100 || true

          done < analysis/binaries.txt \
            | tee analysis/binary-analysis.txt

      - name: Package successful build
        if: success()
        run: |
          mkdir -p artifacts

          while IFS= read -r KEXT; do
            cp -R "$KEXT" artifacts/
          done < <(
            find build -type d -name "AirportItlwm*.kext"
          )

          cp xcodebuild.log artifacts/
          cp compiler-errors.txt artifacts/
          cp -R analysis artifacts/

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            artifacts \
            AirportItlwm-Sequoia-native.zip

      - name: Upload native build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Sequoia-native
          path: AirportItlwm-Sequoia-native.zip

      - name: Upload failed build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Sequoia-build-logs
          path: |
            xcodebuild.log
            compiler-errors.txt
